# Workflow to build the website when a PR is opened
name: Check Build

on:
    pull_request:
        branches: ['main', 'dev']
        paths:
            - 'src/**'
            - 'shared/**'
            - 'supabase/functions/scraper-builder/**'
            - 'supabase/migrations/**'
            - 'scripts/**'
            - 'tests/**'
            - 'database.types.ts'
            - '.github/workflows/build-check.yml'
            - '*.json' # shared trigger (root)

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    # Single deploy job since we're just deploying
    build:
        name: build test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: ./.github/workflows/node-cache

            - name: Typecheck
              run: npm run typecheck

            - name: Regression tests
              run: npm test

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Bundle hosted scraper builder
              run: npm run build:builder-edge

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Check Edge Function module
              run: deno check --no-config supabase/functions/scraper-builder/index.js

            - name: Smoke test Edge Function in Deno
              run: deno run --no-config --allow-env --allow-read scripts/builder/edgeSmoke.mjs
