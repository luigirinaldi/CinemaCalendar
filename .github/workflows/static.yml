name: Deploy production and dev to Pages

on:
    push:
        branches: ['main']
    workflow_dispatch:
    # workflow_run executes from main, which is allowed by the Pages environment.
    workflow_run:
        workflows: ['Dev preview updated']
        branches: ['dev']
        types: [completed]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
        env:
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        strategy:
            matrix:
                include:
                    - branch: main
                      base: /CinemaCalendar/
                    - branch: dev
                      base: /CinemaCalendar/dev/
        steps:
            - name: Validate Supabase build settings
              shell: bash
              run: |
                  : "${VITE_SUPABASE_URL:?Missing VITE_SUPABASE_URL in the github-pages environment}"
                  : "${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY:?Missing VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY in the github-pages environment}"
            - name: Checkout ${{ matrix.branch }}
              uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.branch }}
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Build
              run: npm run build -- --base "${{ matrix.base }}"
            - name: Save build
              uses: actions/upload-artifact@v4
              with:
                  name: site-${{ matrix.branch }}
                  path: dist
                  retention-days: 1

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Download production build
              uses: actions/download-artifact@v4
              with:
                  name: site-main
                  path: _site
            - name: Download dev build
              uses: actions/download-artifact@v4
              with:
                  name: site-dev
                  path: _site/dev
            - name: Setup Pages
              uses: actions/configure-pages@v4
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
